<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Donat Eyen 🍩🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:Poppins,sans-serif}
:root{--p1:#FF69B4;--p2:#FFB6C1;--p3:#FFE4EC;--soft:#FFF0F5;--deep:#E75480;--txt:#5a2a3a;--sh:0 6px 18px rgba(255,105,180,.18)}
body{background:linear-gradient(160deg,#FFF0F5,#FFE4EC 60%,#FFD9E5);color:var(--txt);min-height:100vh;padding-bottom:82px;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;min-height:100vh}

/* SPLASH */
#sp{position:fixed;inset:0;background:linear-gradient(160deg,#FFB6C1,#FF69B4 55%,#E75480);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:.8s;padding:20px;text-align:center;overflow:hidden}
#sp.hide{opacity:0;transform:scale(1.15);pointer-events:none}
.sp-donut{font-size:110px;animation:sp 2s ease-in-out infinite;filter:drop-shadow(0 12px 20px rgba(0,0,0,.25))}
@keyframes sp{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(180deg)}}
.sp-title{font-family:Quicksand;font-size:42px;font-weight:700;color:#fff;margin-top:22px;text-shadow:0 4px 14px rgba(0,0,0,.25);letter-spacing:1px}
.sp-sub{color:#fff;font-size:14px;margin-top:8px;opacity:.95}
.sp-bar{width:170px;height:6px;background:rgba(255,255,255,.35);border-radius:9px;margin-top:30px;overflow:hidden}
.sp-fill{height:100%;width:0;background:#fff;border-radius:9px;animation:ld 2.4s ease forwards}
@keyframes ld{to{width:100%}}
.sp-btn{margin-top:34px;padding:14px 42px;border:none;border-radius:50px;background:#fff;color:var(--deep);font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25);font-family:Quicksand}
.sp-btn:active{transform:scale(.95)}
.petal{position:absolute;font-size:20px;opacity:.85;animation:fl linear infinite;pointer-events:none}
@keyframes fl{0%{transform:translateY(-10vh) rotate(0);opacity:0}10%{opacity:.9}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}

/* HEADER */
.hd{background:linear-gradient(135deg,#FF69B4,#FFB6C1);padding:16px 18px 22px;border-radius:0 0 26px 26px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hd::after{content:'🌸';position:absolute;right:-10px;top:-10px;font-size:80px;opacity:.22}
.hd-top{display:flex;justify-content:space-between;align-items:center;color:#fff}
.brand{font-family:Quicksand;font-weight:700;font-size:20px}
.hd-ic{display:flex;gap:12px}
.hd-ic button{background:rgba(255,255,255,.25);width:38px;height:38px;border-radius:50%;border:none;color:#fff;font-size:18px;cursor:pointer;position:relative;display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:-4px;right:-4px;background:#E75480;color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid #fff}
.greet{color:#fff;margin-top:14px}
.greet h2{font-family:Quicksand;font-size:19px;font-weight:700}
.greet p{font-size:12.5px;opacity:.95;margin-top:2px}
.search{margin-top:12px;background:#fff;border-radius:50px;padding:11px 18px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.search input{border:none;outline:none;flex:1;font-size:14px;background:transparent;color:var(--txt)}
.search input::placeholder{color:#d68aa8}

/* SECTION */
.sec{padding:16px}
.ttl{font-family:Quicksand;font-size:17px;font-weight:700;color:var(--deep);margin-bottom:12px}
.cats{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.cats::-webkit-scrollbar{display:none}
.cat{min-width:72px;padding:11px 6px;background:#fff;border-radius:16px;text-align:center;cursor:pointer;box-shadow:var(--sh);border:2px solid transparent}
.cat.on{border-color:var(--p1);background:var(--soft)}
.cat .ic{font-size:24px}
.cat .lb{font-size:11px;font-weight:600;margin-top:4px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(--sh);cursor:pointer;position:relative}
.card-img{height:118px;background:linear-gradient(135deg,#FFE4EC,#FFC0CB);display:flex;align-items:center;justify-content:center;font-size:58px;position:relative}
.fav{position:absolute;top:8px;right:8px;background:#fff;width:30px;height:30px;border-radius:50%;border:none;font-size:14px;cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.12);z-index:2}
.card-b{padding:10px}
.card-b h4{font-size:13px;font-weight:600;line-height:1.3;min-height:34px}
.card-b .pr{color:var(--deep);font-weight:700;font-size:14.5px;margin-top:5px}
.card-b .rt{font-size:11px;color:#ffb300}
.add{margin-top:8px;width:100%;padding:8px;border:none;border-radius:12px;background:linear-gradient(135deg,#FF69B4,#FFB6C1);color:#fff;font-weight:600;font-size:12px;cursor:pointer}

/* PAGE */
.pg{position:fixed;inset:0;background:linear-gradient(160deg,#FFF0F5,#FFE4EC);z-index:500;overflow-y:auto;transform:translateX(100%);transition:.35s;max-width:480px;margin:0 auto;padding-bottom:100px}
.pg.show{transform:translateX(0)}
.pg-hd{background:linear-gradient(135deg,#FF69B4,#FFB6C1);padding:16px;display:flex;align-items:center;gap:12px;color:#fff;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:10}
.back{background:rgba(255,255,255,.25);width:38px;height:38px;border-radius:50%;border:none;color:#fff;font-size:18px;cursor:pointer}
.pg-hd h3{font-family:Quicksand;font-size:17px;font-weight:700;flex:1}
.d-img{height:225px;background:linear-gradient(135deg,#FFE4EC,#FFC0CB);display:flex;align-items:center;justify-content:center;font-size:125px;border-radius:0 0 28px 28px;margin-bottom:16px}
.d-body{padding:0 18px}
.d-body h2{font-family:Quicksand;font-size:21px;color:var(--deep);font-weight:700}
.d-body .dp{font-size:23px;font-weight:700;color:var(--deep);margin:6px 0}
.d-body .dd{font-size:13px;color:#8a5a6a;line-height:1.6;margin-bottom:14px}
.ot{font-weight:700;font-size:13.5px;margin-bottom:8px}
.tops{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.top{padding:8px 14px;background:#fff;border:2px solid var(--p3);border-radius:50px;font-size:12.5px;font-weight:600;cursor:pointer}
.top.on{background:var(--p1);color:#fff;border-color:var(--p1)}
.qrow{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:14px;border-radius:16px;box-shadow:var(--sh);margin-bottom:14px}
.qctrl{display:flex;align-items:center;gap:14px}
.qctrl button{width:34px;height:34px;border-radius:50%;border:none;background:var(--p3);color:var(--deep);font-size:18px;font-weight:700;cursor:pointer}
.qctrl span{font-weight:700;min-width:22px;text-align:center}
textarea,input,select{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--p3);outline:none;font-size:14px;background:#fff;font-family:Poppins;color:var(--txt);margin-bottom:12px;resize:none}
.btn-p{width:100%;padding:15px;border:none;border-radius:50px;background:linear-gradient(135deg,#FF69B4,#E75480);color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--sh);font-family:Quicksand;letter-spacing:.3px}
.btn-o{width:100%;padding:14px;border:2px solid var(--p1);border-radius:50px;background:#fff;color:var(--deep);font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;font-family:Quicksand}

/* CART */
.citem{display:flex;gap:12px;background:#fff;padding:12px;border-radius:16px;box-shadow:var(--sh);margin-bottom:10px;align-items:center}
.citem .ci{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#FFE4EC,#FFC0CB);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0}
.citem .inf{flex:1;min-width:0}
.citem .inf h4{font-size:13px;font-weight:600}
.citem .inf small{font-size:11px;color:#a06a7a;display:block}
.citem .inf .p{color:var(--deep);font-weight:700;font-size:13.5px;margin-top:3px}
.del{background:#ffe4ec;color:#E75480;border:none;width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:14px}
.sum{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--sh);margin:14px 0}
.sum .r{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.sum .r.tt{border-top:2px dashed var(--p3);margin-top:8px;padding-top:10px;font-weight:700;font-size:15.5px;color:var(--deep)}
.empty{text-align:center;padding:60px 20px;color:#c08aa0}
.empty .e{font-size:65px;opacity:.6}
.empty p{margin-top:10px;font-size:14px}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;display:flex;justify-content:space-around;padding:10px 6px;box-shadow:0 -4px 20px rgba(255,105,180,.2);border-radius:22px 22px 0 0;z-index:400}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;color:#c08aa0;font-size:10px;font-weight:600;padding:4px 10px;border:none;background:none;cursor:pointer;font-family:Poppins;position:relative}
.nav button .n{font-size:20px}
.nav button.on{color:var(--deep)}
.nav button.on .n{transform:scale(1.15)}
.nav .badge{top:-2px;right:2px}

/* FAQ */
.faq{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:var(--sh);overflow:hidden}
.faq-q{padding:14px 16px;font-weight:600;font-size:13.5px;display:flex;justify-content:space-between;cursor:pointer}
.faq-a{max-height:0;overflow:hidden;transition:.3s;padding:0 16px;font-size:13px;color:#8a5a6a;line-height:1.6}
.faq.open .faq-a{max-height:220px;padding:0 16px 14px}

/* MISC */
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--deep);color:#fff;padding:12px 22px;border-radius:50px;font-size:13px;font-weight:600;z-index:8000;transition:.35s;box-shadow:var(--sh);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translateX(-50%) translateY(0)}
.prof-hero{background:linear-gradient(135deg,#FF69B4,#FFB6C1);padding:28px 18px;border-radius:0 0 28px 28px;text-align:center;color:#fff}
.av{width:78px;height:78px;border-radius:50%;background:#fff;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 6px 18px rgba(0,0,0,.15)}
.prof-hero h2{font-family:Quicksand;font-size:19px;font-weight:700}
.prof-hero p{font-size:12.5px;opacity:.95;margin-top:2px}
.menu{background:#fff;border-radius:18px;margin:14px;box-shadow:var(--sh);overflow:hidden}
.menu div{display:flex;align-items:center;gap:14px;padding:15px 18px;border-bottom:1px solid #fff0f5;cursor:pointer;font-size:14px}
.menu div:last-child{border:none}
.menu .mi{font-size:20px;width:24px;text-align:center}
.menu .ar{margin-left:auto;color:#d68aa8}
.info{background:#fff;border-radius:18px;padding:18px;margin:14px;box-shadow:var(--sh);text-align:center}
.info .ic{font-size:44px}
.info h3{font-family:Quicksand;color:var(--deep);margin-top:6px}
.info p{font-size:12.5px;color:#8a5a6a;margin-top:6px;line-height:1.6}
.wa-btn{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:#25D366;color:#fff;padding:12px 26px;border-radius:50px;text-decoration:none;font-weight:700;font-size:13.5px;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.rev{background:#fff;padding:14px;border-radius:16px;box-shadow:var(--sh);margin-bottom:10px}
.rev-h{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.rev-h .a{width:36px;height:36px;border-radius:50%;background:var(--p3);display:flex;align-items:center;justify-content:center;font-size:18px}
.rev-h b{font-size:13px}.rev-h small{font-size:11px;color:#b08a98;display:block}
.rev p{font-size:12.5px;color:#7a5060;line-height:1.5}
.nf{background:#fff;padding:14px;border-radius:16px;box-shadow:var(--sh);margin-bottom:10px;display:flex;gap:12px}
.nf .i{font-size:24px}.nf b{font-size:13px}.nf small{font-size:11px;color:#b08a98;display:block;margin-top:2px}
.nf p{font-size:12.5px;color:#7a5060;margin-top:4px}
.hist{background:#fff;padding:14px;border-radius:16px;box-shadow:var(--sh);margin-bottom:10px}
.hist .t{display:flex;justify-content:space-between;font-size:12px;color:#a06a7a;margin-bottom:6px}
.hist .s{background:#e8f5e9;color:#2e7d32;padding:3px 10px;border-radius:50px;font-size:10.5px;font-weight:700}
.hist h4{font-size:13px;font-weight:600}
.hist .p{color:var(--deep);font-weight:700;margin-top:6px;font-size:14px}
</style>
</head>
<body>

<div id="sp">
  <div class="sp-donut">🍩</div>
  <div class="sp-title">DONAT EYEN</div>
  <div class="sp-sub">Donat Susu Lembut, Manisnya Bikin Kangen 💗</div>
  <div class="sp-bar"><div class="sp-fill"></div></div>
  <button class="sp-btn" onclick="enter()">Masuk ke Toko 🌸</button>
</div>

<div id="app"></div>
<div class="pg" id="pg"></div>
<div class="nav" id="nav"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ KONFIG ============ */
const WA="6283804717963";
const TOPING=["Keju","Coklat","Kacang","Meses","Oreo","Strawberry","Tiramisu","Matcha","Blueberry"];
const PROD=[
 {id:1,n:"Donat Susu Original",p:2500,e:"🍩",c:"donat",r:4.9,s:1200,d:"Donat susu lembut khas Eyen, dibuat dari susu segar pilihan. Empuk, manis pas, cocok untuk cemilan keluarga.",t:false},
 {id:2,n:"Donat Susu + Toping",p:12000,e:"🍩",c:"donat",r:4.9,s:850,d:"Donat susu lembut dengan aneka toping favorit. Pilih toping sesuai selera!",t:true},
 {id:3,n:"Pisang Bertoping",p:11000,e:"🍌",c:"pisang",r:4.8,s:420,d:"Pisang goreng crispy dengan toping manis. Renyah di luar, lembut di dalam.",t:true},
 {id:4,n:"Roti Pisang",p:11000,e:"🍞",c:"roti",r:4.8,s:380,d:"Roti pisang homemade, lembut dan harum. Dibuat fresh setiap hari.",t:false}
];
const FAQ=[
 {q:"Cara pesan donat?",a:"Pilih produk, tambah ke keranjang, isi data di checkout, lalu tekan 'Pesan via WhatsApp'. Pesanan otomatis terkirim ke WA kami."},
 {q:"Bisa COD?",a:"Bisa! Kami menerima COD, transfer bank, dan QRIS."},
 {q:"Berapa lama pengiriman?",a:"Area kota 30-60 menit. Luar kota 1-2 jam tergantung jarak."},
 {q:"Bisa custom toping?",a:"Tentu! Pilih toping sesukamu di halaman detail produk."},
 {q:"Minimal order?",a:"Tidak ada minimal order."}
];

/* ============ STORAGE ============ */
const S={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
let cart=S.get('eyen_cart',[]),favs=S.get('eyen_favs',[]),hist=S.get('eyen_hist',[]),prof=S.get('eyen_prof',{nama:"Pelanggan Cantik",hp:"",alamat:""});
const save=()=>{S.set('eyen_cart',cart);S.set('eyen_favs',favs);S.set('eyen_hist',hist);S.set('eyen_prof',prof)};

/* ============ HELPERS ============ */
const rp=n=>"Rp "+n.toLocaleString('id-ID');
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function updBadge(){
 const cc=cart.reduce((s,i)=>s+i.qty,0),fc=favs.length;
 document.querySelectorAll('.bCart').forEach(e=>{e.textContent=cc;e.style.display=cc?'flex':'none'});
 document.querySelectorAll('.bFav').forEach(e=>{e.textContent=fc;e.style.display=fc?'flex':'none'});
}

/* ============ SPLASH ============ */
(function petals(){const ic=['🌸','💮','🌷','💗','🌺'];for(let i=0;i<12;i++){const p=document.createElement('div');p.className='petal';p.textContent=ic[i%ic.length];p.style.left=Math.random()*100+'%';p.style.animationDuration=(6+Math.random()*6)+'s';p.style.animationDelay=(Math.random()*5)+'s';p.style.fontSize=(14+Math.random()*14)+'px';$('sp').appendChild(p)}})();
function enter(){$('sp').classList.add('hide');setTimeout(()=>$('sp').style.display='none',800)}

/* ============ NAV ============ */
let tab='home';
function renderNav(){
 const T=[{id:'home',i:'🏠',l:'Home'},{id:'search',i:'🔍',l:'Cari'},{id:'cart',i:'🛒',l:'Keranjang',b:'bCart'},{id:'fav',i:'❤️',l:'Favorit',b:'bFav'},{id:'profile',i:'👤',l:'Profil'}];
 $('nav').innerHTML=T.map(t=>`<button class="${tab===t.id?'on':''}" onclick="go('${t.id}')"><span class="n">${t.i}</span><span>${t.l}</span>${t.b?`<span class="badge ${t.b}" style="display:none">0</span>`:''}</button>`).join('');
 updBadge();
}
function go(t){tab=t;renderNav();render();window.scrollTo(0,0)}

/* ============ PAGE RENDER ============ */
function render(){
 const a=$('app');
 if(tab==='home')a.innerHTML=vHome();
 else if(tab==='search')a.innerHTML=vSearch();
 else if(tab==='cart')a.innerHTML=vCart();
 else if(tab==='fav')a.innerHTML=vFav();
 else if(tab==='profile')a.innerHTML=vProfile();
 updBadge();
 if(tab==='search')setTimeout(()=>$('sInput')?.focus(),80);
}

/* ============ VIEW HOME ============ */
function vHome(){
 return `
 <div class="hd">
  <div class="hd-top">
   <div class="brand">🍩 DONAT EYEN</div>
   <div class="hd-ic">
    <button onclick="openNotif()">🔔</button>
    <button onclick="go('cart')">🛒<span class="badge bCart" style="display:none">0</span></button>
   </div>
  </div>
  <div class="greet"><h2>Hai Cantik 🌸</h2><p>Mau donat apa hari ini? 🍩</p></div>
  <div class="search" onclick="go('search')"><span>🔍</span><input placeholder="Cari donat favoritmu..." readonly></div>
 </div>
 <div class="sec" style="padding-top:0">
  <div class="ttl">🌸 Kategori</div>
  <div class="cats">
   <div class="cat on" onclick="go('search')"><div class="ic">🍩</div><div class="lb">Donat</div></div>
   <div class="cat" onclick="go('search')"><div class="ic">🍌</div><div class="lb">Pisang</div></div>
   <div class="cat" onclick="go('search')"><div class="ic">🍞</div><div class="lb">Roti</div></div>
   <div class="cat" onclick="openFAQ()"><div class="ic">❓</div><div class="lb">FAQ</div></div>
  </div>
 </div>
 <div class="sec" style="padding-top:0">
  <div class="ttl">⭐ Best Seller</div>
  <div class="grid">${PROD.map(pCard).join('')}</div>
 </div>
 <div class="sec" style="padding-top:0">
  <div class="ttl">⭐ Review Pembeli</div>
  ${rev("Sinta","🌸","Donatnya lembut banget! Topping banyak, anak-anak suka.")}
  ${rev("Dewi","🌷","Langganan tiap minggu. Harga murah rasa premium 💗")}
  ${rev("Rina","💮","Pisang bertopingnya juara! Crispy di luar lembut di dalam 😍")}
 </div>
 <div class="info">
  <div class="ic">🍩</div><h3>Donat Eyen</h3>
  <p>Dibuat fresh setiap hari 🌸<br>Susu segar pilihan, toping melimpah, harga ramah.</p>
  <a class="wa-btn" href="https://wa.me/${WA}?text=${encodeURIComponent("Halo DONAT EYEN 🍩🌸 saya mau tanya-tanya dulu ya")}" target="_blank">💬 Chat 0838-0471-7963</a>
 </div>`;
}
function pCard(p){
 const f=favs.includes(p.id);
 return `<div class="card" onclick="openDetail(${p.id})">
  <div class="card-img">${p.e}<button class="fav" onclick="event.stopPropagation();togFav(${p.id})">${f?'💖':'🤍'}</button></div>
  <div class="card-b">
   <h4>${p.n}</h4>
   <div class="rt">⭐ ${p.r} • ${p.s}+ terjual</div>
   <div class="pr">${rp(p.p)}</div>
   <button class="add" onclick="event.stopPropagation();qAdd(${p.id})">+ Keranjang</button>
  </div></div>`;
}
function rev(n,a,t){return `<div class="rev"><div class="rev-h"><div class="a">${a}</div><div><b>${n}</b><small>⭐⭐⭐⭐⭐</small></div></div><p>${t}</p></div>`}

/* ============ VIEW SEARCH ============ */
let sq="",sc="all";
function vSearch(){
 const C=[{id:'all',l:'Semua',i:'✨'},{id:'donat',l:'Donat',i:'🍩'},{id:'pisang',l:'Pisang',i:'🍌'},{id:'roti',l:'Roti',i:'🍞'}];
 const list=PROD.filter(p=>p.n.toLowerCase().includes(sq.toLowerCase())&&(sc==='all'||p.c===sc));
 return `<div class="hd" style="padding-bottom:18px">
  <div class="hd-top"><div class="brand">🔍 Pencarian</div></div>
  <div class="search"><span>🔍</span><input id="sInput" placeholder="Cari donat favoritmu..." value="${sq}" oninput="sq=this.value;render()"></div>
 </div>
 <div class="sec" style="padding-bottom:6px"><div class="cats">
  ${C.map(c=>`<div class="cat ${sc===c.id?'on':''}" onclick="sc='${c.id}';render()"><div class="ic">${c.i}</div><div class="lb">${c.l}</div></div>`).join('')}
 </div></div>
 <div class="sec" style="padding-top:6px">
  <div class="ttl">🍩 ${list.length} Produk</div>
  ${list.length?`<div class="grid">${list.map(pCard).join('')}</div>`:`<div class="empty"><div class="e">🔍</div><p>Produk tidak ditemukan</p></div>`}
 </div>`;
}

/* ============ VIEW CART ============ */
function vCart(){
 if(!cart.length)return wrap('🛒 Keranjang',`<div class="empty"><div class="e">🛒</div><p>Keranjangmu masih kosong</p><br><button class="btn-p" style="width:auto;padding:12px 30px" onclick="go('home')">Mulai Belanja</button></div>`);
 const st=cart.reduce((s,i)=>s+i.p*i.qty,0);
 return wrap('🛒 Keranjang',`<div style="padding:18px">
  ${cart.map((it,i)=>`<div class="citem">
   <div class="ci">${it.e}</div>
   <div class="inf">
    <h4>${it.n}</h4>
    ${it.top?.length?`<small>Topping: ${it.top.join(', ')}</small>`:''}
    ${it.note?`<small>Catatan: ${it.note}</small>`:''}
    <div class="p">${rp(it.p)} × ${it.qty}</div>
   </div>
   <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
    <div class="qctrl"><button onclick="chQty(${i},-1)">−</button><span>${it.qty}</span><button onclick="chQty(${i},1)">+</button></div>
    <button class="del" onclick="rmItem(${i})">🗑️</button>
   </div>
  </div>`).join('')}
  <div class="sum">
   <div class="r"><span>Subtotal (${cart.reduce((s,i)=>s+i.qty,0)} item)</span><span>${rp(st)}</span></div>
   <div class="r"><span>Ongkir</span><span>Dihitung di WA</span></div>
   <div class="r tt"><span>Total</span><span>${rp(st)}</span></div>
  </div>
  <button class="btn-p" onclick="openCheckout()">💳 Lanjut ke Checkout</button>
  <button class="btn-o" onclick="go('home')">Tambah Produk Lagi</button>
 </div>`);
}
function chQty(i,d){cart[i].qty+=d;if(cart[i].qty<1)cart.splice(i,1);save();render()}
function rmItem(i){cart.splice(i,1);save();render();toast('Produk dihapus')}

/* ============ VIEW FAV ============ */
function vFav(){
 const list=PROD.filter(p=>favs.includes(p.id));
 return wrap('❤️ Favorit',`<div class="sec" style="padding-top:14px">
  ${list.length?`<div class="grid">${list.map(pCard).join('')}</div>`:`<div class="empty"><div class="e">💗</div><p>Belum ada favorit</p><br><button class="btn-p" style="width:auto;padding:12px 30px" onclick="go('home')">Cari Produk</button></div>`}
 </div>`);
}
function togFav(id){const i=favs.indexOf(id);if(i>-1){favs.splice(i,1);toast('Dihapus dari favorit')}else{favs.push(id);toast('❤️ Ditambahkan ke favorit')}save();render()}

/* ============ VIEW PROFILE ============ */
function vProfile(){
 return `<div class="prof-hero">
  <div class="av">👩</div>
  <h2>${prof.nama}</h2>
  <p>${prof.hp||'Belum ada no. HP'}</p>
 </div>
 <div class="menu">
  <div onclick="editProf()"><span class="mi">👤</span>Edit Profil<span class="ar">›</span></div>
  <div onclick="openHistory()"><span class="mi">📜</span>Riwayat Pesanan<span class="ar">›</span></div>
  <div onclick="openNotif()"><span class="mi">🔔</span>Notifikasi<span class="ar">›</span></div>
  <div onclick="openReview()"><span class="mi">⭐</span>Beri Review<span class="ar">›</span></div>
  <div onclick="openFAQ()"><span class="mi">❓</span>FAQ<span class="ar">›</span></div>
 </div>
 <div class="info">
  <div class="ic">🍩</div><h3>Donat Eyen</h3>
  <p>Donat susu lembut dengan cinta 💗</p>
  <a class="wa-btn" href="https://wa.me/${WA}?text=${encodeURIComponent("Halo DONAT EYEN 🍩🌸")}" target="_blank">💬 0838-0471-7963</a>
 </div>`;
}
function wrap(t,b){return `<div class="pg-hd"><button class="back" onclick="go('${tab}')">←</button><h3>${t}</h3></div>${b}`}

/* ============ DETAIL PRODUK ============ */
let cP=null,cQ=1,cT=[],cN="";
function openDetail(id){
 cP=PROD.find(p=>p.id===id);cQ=1;cT=[];cN="";
 const f=favs.includes(cP.id);
 $('pg').innerHTML=`
 <div class="pg-hd">
  <button class="back" onclick="closePg()">←</button>
  <h3>Detail Produk</h3>
  <button class="back" onclick="togFav(${cP.id});openDetail(${cP.id})">${f?'💖':'🤍'}</button>
 </div>
 <div class="d-img">${cP.e}</div>
 <div class="d-body">
  <h2>${cP.n}</h2>
  <div class="rt" style="margin-top:4px;font-size:12px;color:#ffb300">⭐ ${cP.r} • ${cP.s}+ terjual</div>
  <div class="dp">${rp(cP.p)}</div>
  <p class="dd">${cP.d}</p>
  ${cP.t?`<div class="ot">🍩 Pilih Toping (bisa lebih dari satu)</div><div class="tops">${TOPING.map(t=>`<div class="top" onclick="togTop(this,'${t}')">${t}</div>`).join('')}</div>`:''}
  <div class="qrow"><b>Jumlah</b><div class="qctrl"><button onclick="dq(-1)">−</button><span id="qV">1</span><button onclick="dq(1)">+</button></div></div>
  <div class="ot">📝 Catatan (opsional)</div>
  <textarea rows="2" placeholder="Contoh: tanpa meses, extra keju..." oninput="cN=this.value"></textarea>
  <button class="btn-p" onclick="addCart()">🛒 Tambah ke Keranjang</button>
  <button class="btn-o" onclick="addCart(true)">⚡ Beli Sekarang</button>
 </div>`;
 $('pg').classList.add('show');
}
function closePg(){$('pg').classList.remove('show')}
function togTop(el,t){const i=cT.indexOf(t);if(i>-1){cT.splice(i,1);el.classList.remove('on')}else{cT.push(t);el.classList.add('on')}}
function dq(d){cQ=Math.max(1,cQ+d);$('qV').textContent=cQ}
function addCart(buy=false){
 if(cP.t&&!cT.length){toast('Pilih minimal 1 toping dulu ya 🌸');return}
 cart.push({pid:cP.id,n:cP.n,p:cP.p,e:cP.e,qty:cQ,top:[...cT],note:cN});
 save();toast('✅ Masuk keranjang!');closePg();
 if(buy)openCheckout();else updBadge();
}
function qAdd(id){const p=PROD.find(x=>x.id===id);if(p.t){openDetail(id);return}cart.push({pid:p.id,n:p.n,p:p.p,e:p.e,qty:1,top:[],note:""});save();updBadge();toast('✅ Masuk keranjang!')}

/* ============ CHECKOUT ============ */
function openCheckout(){
 if(!cart.length){toast('Keranjang masih kosong');return}
 const st=cart.reduce((s,i)=>s+i.p*i.qty,0);
 $('pg').innerHTML=`
 <div class="pg-hd"><button class="back" onclick="closePg()">←</button><h3>Checkout</h3></div>
 <div style="padding:18px">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Nama Pembeli *</label>
  <input id="cNama" value="${prof.nama}">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">No. HP / WhatsApp *</label>
  <input id="cHp" value="${prof.hp}" inputmode="numeric" placeholder="08xxxxxxxxxx">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Alamat Lengkap *</label>
  <input id="cAlamat" value="${prof.alamat}" placeholder="Jalan, No, RT/RW, Kel, Kec">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Metode Pengiriman</label>
  <select id="cKirim"><option>Diantar Kurir</option><option>Ambil Sendiri</option><option>COD (Bayar di Tempat)</option></select>
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Metode Pembayaran</label>
  <select id="cBayar"><option>COD</option><option>Transfer Bank</option><option>QRIS</option><option>E-Wallet (Dana/OVO/Gopay)</option></select>
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Catatan Tambahan</label>
  <input id="cNote" placeholder="Contoh: kirim siang, dll">
  <div class="sum">
   <div style="font-weight:700;margin-bottom:8px;color:var(--deep)">🛒 Rincian Pesanan</div>
   ${cart.map(i=>`<div class="r"><span>${i.e} ${i.n}${i.top?.length?' ('+i.top.join(', ')+')':''} × ${i.qty}</span><span>${rp(i.p*i.qty)}</span></div>`).join('')}
   <div class="r tt"><span>Total</span><span>${rp(st)}</span></div>
   <div class="r" style="font-size:11px;color:#a06a7a"><span>*Ongkir dihitung via WA</span></div>
  </div>
  <button class="btn-p" onclick="submitOrder()">💬 Pesan via WhatsApp</button>
  <button class="btn-o" onclick="closePg()">Kembali</button>
 </div>`;
 $('pg').classList.add('show');
}
function submitOrder(){
 const nama=$('cNama').value.trim(),hp=$('cHp').value.trim(),alamat=$('cAlamat').value.trim(),kirim=$('cKirim').value,bayar=$('cBayar').value,note=$('cNote').value.trim();
 if(!nama){toast('Isi nama dulu ya 🌸');return}
 if(!hp){toast('Isi no. HP dulu ya 🌸');return}
 if(!alamat){toast('Isi alamat dulu ya 🌸');return}
 prof.nama=nama;prof.hp=hp;prof.alamat=alamat;
 const st=cart.reduce((s,i)=>s+i.p*i.qty,0);
 let m=`Halo *DONAT EYEN* 🍩🌸\nSaya mau pesan:\n\n🛒 *PESANAN SAYA:*\n`;
 cart.forEach((i,x)=>{m+=`${x+1}. ${i.n}\n`;if(i.top?.length)m+=`   Toping: ${i.top.join(', ')}\n`;if(i.note)m+=`   Catatan: ${i.note}\n`;m+=`   Jumlah: ${i.qty} pcs\n   Harga: ${rp(i.p*i.qty)}\n\n`});
 m+=`💰 *Total: ${rp(st)}*\n\n👤 Nama: ${nama}\n📱 HP: ${hp}\n📍 Alamat: ${alamat}\n🚚 Pengiriman: ${kirim}\n💳 Pembayaran: ${bayar}\n`;
 if(note)m+=`📝 Catatan: ${note}\n`;
 m+=`\nMohon dikonfirmasi ya, terima kasih 🙏💗`;
 hist.unshift({tgl:new Date().toLocaleString('id-ID'),items:[...cart],total:st,status:"Menunggu Konfirmasi"});
 save();
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank');
 cart=[];save();closePg();updBadge();
 setTimeout(()=>{toast('✅ Pesanan dikirim ke WhatsApp!');go('home')},500);
}

/* ============ MODALS ============ */
function modal(t,h){$('pg').innerHTML=`<div class="pg-hd"><button class="back" onclick="closePg()">←</button><h3>${t}</h3></div><div style="padding:16px">${h}</div>`;$('pg').classList.add('show')}

function openHistory(){
 const h=hist.length?hist.map((x,i)=>`<div class="hist">
  <div class="t"><span>📅 ${x.tgl}</span><span class="s">${x.status}</span></div>
  <h4>${x.items.map(y=>y.n+' ×'+y.qty).join(', ')}</h4>
  <div class="p">Total: ${rp(x.total)}</div>
  <button class="btn-p" style="margin-top:10px;padding:10px;font-size:13px" onclick="reorder(${i})">🔁 Pesan Lagi</button>
 </div>`).join(''):`<div class="empty"><div class="e">📜</div><p>Belum ada riwayat pesanan</p></div>`;
 modal("📜 Riwayat Pesanan",h);
}
function reorder(i){hist[i].items.forEach(it=>cart.push({...it}));save();updBadge();closePg();go('cart');toast('✅ Masuk keranjang!')}

function openNotif(){
 modal("🔔 Notifikasi",`
  <div class="nf"><div class="i">🌸</div><div><b>Selamat datang di Donat Eyen</b><small>Hari ini</small><p>Terima kasih sudah mampir! Pesan donat favoritmu sekarang.</p></div></div>
  <div class="nf"><div class="i">🍩</div><div><b>Produk Fresh Setiap Hari</b><small>Info</small><p>Donat susu lembut dibuat fresh setiap hari.</p></div></div>
  <div class="nf"><div class="i">💗</div><div><b>Bisa Custom Toping</b><small>Info</small><p>Pilih toping sesukamu di halaman detail produk.</p></div></div>
 `);
}
function openReview(){
 modal("⭐ Beri Review",`
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Nama</label>
  <input id="rN" value="${prof.nama}">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Rating</label>
  <select id="rR"><option value="5">⭐⭐⭐⭐⭐ Luar biasa</option><option value="4">⭐⭐⭐⭐ Enak</option><option value="3">⭐⭐⭐ Cukup</option><option value="2">⭐⭐ Kurang</option><option value="1">⭐ Kecewa</option></select>
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Komentar</label>
  <textarea id="rT" rows="4" placeholder="Ceritakan pengalamanmu..."></textarea>
  <button class="btn-p" onclick="kirimRev()">Kirim Review</button>
 `);
}
function kirimRev(){
 const n=$('rN').value.trim(),t=$('rT').value.trim();
 if(!n||!t){toast('Isi nama & komentar ya 🌸');return}
 const m=`Halo DONAT EYEN 🍩🌸\nSaya mau kasih review:\n\nNama: ${n}\nRating: ${$('rR').value} bintang\nKomentar: ${t}`;
 window.open(`https://wa.me/${WA}?text=${encodeURIComponent(m)}`,'_blank');
 closePg();toast('✅ Review terkirim!');
}
function openFAQ(){modal("❓ FAQ",FAQ.map((f,i)=>`<div class="faq" id="fq${i}"><div class="faq-q" onclick="$('fq${i}').classList.toggle('open')"><span>${f.q}</span><span>▾</span></div><div class="faq-a">${f.a}</div></div>`).join(''))}
function editProf(){
 modal("👤 Edit Profil",`
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Nama</label>
  <input id="pN" value="${prof.nama}">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">No. HP</label>
  <input id="pH" value="${prof.hp}" inputmode="numeric">
  <label style="font-size:12.5px;font-weight:600;display:block;margin-bottom:5px">Alamat</label>
  <input id="pA" value="${prof.alamat}">
  <button class="btn-p" onclick="saveProf()">Simpan</button>
 `);
}
function saveProf(){prof.nama=$('pN').value.trim()||prof.nama;prof.hp=$('pH').value.trim();prof.alamat=$('pA').value.trim();save();closePg();render();toast('✅ Profil disimpan')}

/* ============ INIT ============ */
renderNav();render();updBadge();
</script>
</body>
</html>
